[package]
name = "board-cut-optimizer"
version = "1.0.27"
edition = "2024"
license = "MIT"
build = "build.rs"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
uuid = { version = "1", features = ["v4"] }
rfd = { version = "0.15", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_Controls_Dialogs", "Win32_System_Memory", "Win32_Globalization", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = "debuginfo"
